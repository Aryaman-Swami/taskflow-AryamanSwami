# Production overrides — merged on top of values.yaml during deploy.
# image.tag and secrets are set via --set flags in CI, not stored here.

replicaCount: 3

image:
  # Replace with your actual ECR URI
  repository: "107636266362.dkr.ecr.ap-south-1.amazonaws.com/taskflow"
  tag: ""        # Set by CI: --set image.tag=${{ github.sha }}
  pullPolicy: Always

ingress:
  hosts:
    - host: "api.yourdomain.com"   # Replace with your real domain
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: taskflow-tls
      hosts:
        - api.yourdomain.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10

postgresql:
  primary:
    persistence:
      size: 20Gi
