apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: taskflow-cluster-v1
  region: ap-south-1       # Mumbai region (closest to Nashik)
  version: "1.30"

managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium
    minSize: 1
    desiredCapacity: 2
    maxSize: 3
    availabilityZones: ["ap-south-1a", "ap-south-1b"]